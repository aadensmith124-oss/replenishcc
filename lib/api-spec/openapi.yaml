      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Product deleted
        "400":
          description: Invalid product identifier
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Product not found
        "409":
          description: Product has inventory or order history and cannot be deleted
  /admin/license-products/{productId}/stock:
    post:
      operationId: addAdminLicenseStock
      tags: [licenseStore]
      summary: Add a batch of license keys to a product's available stock
      parameters:
