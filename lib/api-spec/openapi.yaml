      responses:
        "200":
          description: Orders belonging to the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLicenseOrdersResponse"
        "401":
          description: Sign-in required
    post:
      operationId: createLicenseOrder
      tags: [licenseStore]
      summary: Purchase a product using the signed-in user's account balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicenseOrderInput"
      responses:
        "201":
          description: Purchase completed and license keys delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseOrderPurchaseResult"
        "400":
          description: Invalid product or quantity
        "401":
          description: Sign-in required
        "404":
          description: Product not found or no longer available
        "409":
          description: Insufficient balance, stock, or a coupon is invalid or exhausted
  /admin/license-products:
    get:
      operationId: getAdminLicenseProducts
      tags: [licenseStore]
      summary: List all license products and inventory counts for an administrator
      responses:
        "200":
          description: All products, including products with no stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLicenseProductsResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
    post:
      operationId: createAdminLicenseProduct
      tags: [licenseStore]
      summary: Create a license product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicenseProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseProduct"
