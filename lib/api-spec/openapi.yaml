    AddGiftCardStockResponse:
      type: object
      properties:
        addedCount: { type: integer }
        availableCount: { type: integer }
        binMetadataApplied: { type: boolean }
        binMetadataCardsUpdated: { type: integer }
        binMetadataPrefixesLookedUp: { type: integer }
        redemptionZipApplied: { type: boolean }
        locationMetadataApplied: { type: boolean }
      required: [addedCount, availableCount, binMetadataApplied, binMetadataCardsUpdated, binMetadataPrefixesLookedUp, redemptionZipApplied, locationMetadataApplied]
    RefreshGiftCardBinMetadataResponse:
      type: object
      properties:
        cardCount: { type: integer }
        prefixesLookedUp: { type: integer }
        cardsUpdated: { type: integer }
        prefixesUnavailable: { type: integer }
      required: [cardCount, prefixesLookedUp, cardsUpdated, prefixesUnavailable]
    GiftCardCredential:
      type: object
      properties:
        cardNumber: { type: string }
        expiration: { type: string }
        securityCode: { type: string }
        email: { type: ["string", "null"], format: email, maxLength: 320 }
        phone: { type: ["string", "null"], maxLength: 40 }
        cardholderName: { type: ["string", "null"], maxLength: 120 }
        cardType: { type: string, maxLength: 80 }
        issuer: { type: string, maxLength: 80 }
        brand: { type: string, maxLength: 80 }
        publicLocation: { $ref: "#/components/schemas/GiftCardPublicLocation" }
      required: [cardNumber, expiration, securityCode]
    PurchaseGiftCardInput:
      type: object
      properties:
        productId: { type: string, format: uuid }
        inventoryId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1 }
      required: [productId, inventoryId, quantity]
    BulkPurchaseGiftCardsInput:
      type: object
      properties:
        inventoryIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
      required: [inventoryIds]
    GiftCardBulkOrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        totalCents: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, productId, productName, totalCents, createdAt]
    GiftCardBulkPurchaseResult:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/GiftCardBulkOrderSummary" }
        totalCents: { type: integer }
        balanceCents: { type: integer }
      required: [orders, totalCents, balanceCents]
    GiftCardPublicLocation:
      type: object
      properties:
        address: { type: string }
        city: { type: string }
        state: { type: string }
        regionZip: { type: ["string", "null"], maxLength: 10 }
      required: [address, city, state, regionZip]
    GiftCardOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        description: { type: string }
        faceValueCents: { type: integer }
        quantity: { type: integer }
        unitPriceCents: { type: integer }
        totalCents: { type: integer }
        deliveredCards:
          type: array
          items: { $ref: "#/components/schemas/GiftCardCredential" }
        createdAt: { type: string, format: date-time }
      required: [id, productId, productName, description, faceValueCents, quantity, unitPriceCents, totalCents, deliveredCards, createdAt]
    MyGiftCardOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/GiftCardOrder" }
      required: [orders]
    GiftCardPurchaseResult:
      type: object
      properties:
        order: { $ref: "#/components/schemas/GiftCardOrder" }
        balanceCents: { type: integer }
      required: [order, balanceCents]

