        "400":
          description: Invalid key batch
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Product not found
        "409":
          description: One or more keys already exist
  /gift-card-products:
    get:
      operationId: getGiftCardProducts
      tags: [giftCardStore]
      summary: List prepaid gift-card products that have available stock
      responses:
        "200":
          description: Available prepaid gift-card products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCardProductsResponse"
        "401":
          description: Sign-in required
  /orders/gift-cards:
    get:
      operationId: getMyGiftCardOrders
      tags: [giftCardStore]
      summary: List the signed-in user's gift-card orders and delivered cards
      responses:
        "200":
          description: Gift-card orders belonging to the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyGiftCardOrdersResponse"
        "401":
          description: Sign-in required
    post:
      operationId: purchaseGiftCard
      tags: [giftCardStore]
      summary: Purchase prepaid gift cards using the signed-in user's account balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseGiftCardInput"
      responses:
        "201":
          description: Purchase completed and gift cards delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCardPurchaseResult"
        "400":
          description: Invalid product or quantity
        "401":
          description: Sign-in required
        "404":
          description: Product not found or no longer available
        "409":
          description: Insufficient balance or stock
  /orders/gift-cards/bulk:
    post:
      operationId: bulkPurchaseGiftCards
      tags: [giftCardStore]
      summary: Purchase one card from each selected listing in a single atomic checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPurchaseGiftCardsInput"
      responses:
        "201":
          description: All selected cards purchased successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCardBulkPurchaseResult"
        "400":
          description: Invalid or duplicate listing selections
        "401":
          description: Sign-in required
        "404":
          description: One or more listings no longer exist
        "409":
          description: Insufficient balance or stock for the entire selection
  /admin/gift-card-products:
    get:
      operationId: getAdminGiftCardProducts
      tags: [giftCardStore]
      summary: List prepaid gift-card products, including archived bases, for an administrator
      responses:
        "200":
          description: All gift-card products, including archived products and products with no stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGiftCardProductsResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
    post:
      operationId: createAdminGiftCardProduct
      tags: [giftCardStore]
      summary: Create a card base with a per-card purchase price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGiftCardProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGiftCardProduct"
        "400":
          description: Invalid product details
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/gift-card-products/{productId}:
    delete:
      operationId: deleteAdminGiftCardProduct
      tags: [giftCardStore]
      summary: Delete an empty base or archive a base with inventory or order history
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Base removal outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCardBaseRemovalResult"
        "400":
          description: Invalid product identifier
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Product not found
  /admin/gift-card-products/{productId}/restore:
    post:
      operationId: restoreAdminGiftCardProduct
      tags: [giftCardStore]
      summary: Restore an archived gift-card base to member sales
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Base restored
        "400":
          description: Invalid product identifier
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Product not found
  /admin/gift-card-products/{productId}/metadata:
    patch:
      operationId: updateAdminGiftCardProductMetadata
      tags: [giftCardStore]
      summary: Update public metadata for a gift-card product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/UpdateGiftCardProductMetadataInput"
      responses:
        "204":
          description: Product metadata updated
        "400":
          description: Invalid product identifier or metadata
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Product not found
  /admin/gift-card-products/{productId}/stock:
    post:
      operationId: addAdminGiftCardStock
      tags: [giftCardStore]
      summary: Add a batch of prepaid gift cards to a base
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGiftCardStockInput"
      responses:
        "200":
          description: All valid gift cards in the batch added to the base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddGiftCardStockResponse"
        "400":
          description: Invalid gift-card batch
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Product not found
        "409":
          description: Base already has or previously had inventory or orders
  /admin/gift-card-products/{productId}/refresh-bin-metadata:
    post:
      operationId: refreshAdminGiftCardBinMetadata
      tags: [giftCardStore]
      summary: Look up BIN metadata for cards already in a base
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: BIN lookup results saved to individual cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshGiftCardBinMetadataResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Product not found
  /admin/coupons:
    get:
      operationId: getAdminCoupons
      tags: [licenseStore]
      summary: List checkout discount coupons for administrators
      responses:
        "200":
          description: Coupons and their redemption counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCouponsResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
    post:
      operationId: createAdminCoupon
      tags: [licenseStore]
      summary: Create a percentage-off checkout coupon with a redemption cap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponInput"
      responses:
        "201":
          description: Coupon created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCoupon"
        "400":
          description: Invalid coupon details
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "409":
          description: Coupon code already exists
        "503":
          description: A unique coupon code could not be generated
  /admin/dashboard/overview:
    get:
      operationId: getAdminDashboardOverview
      tags: [adminDashboard]
      summary: Get real account, sales, and available-stock totals
      responses:
        "200":
          description: Current totals from member accounts, completed orders, and available inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardOverviewResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /member/page-visibility:
    get:
      operationId: getMemberPageVisibility
      tags: [memberPages]
      summary: Get member-facing page visibility settings
      responses:
        "200":
          description: Current page settings; all pages are visible by default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPageVisibilityResponse"
        "401":
          description: Sign-in required
  /admin/member-page-visibility:
    put:
      operationId: updateAdminMemberPageVisibility
      tags: [adminDashboard]
      summary: Update which member pages are visible and accessible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPageVisibilityUpdate"
      responses:
        "200":
          description: Saved page visibility settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPageVisibilityResponse"
        "400":
          description: Invalid page visibility settings
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        username:
          type: [string, "null"]
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        isDepositAdmin:
          type: boolean
      required: [id, fullName, username, email, createdAt, isDepositAdmin]
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        username: { type: ["string", "null"] }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        balanceCents: { type: integer }
        isAdmin: { type: boolean }
        isEnvironmentAdmin: { type: boolean }
      required: [id, fullName, username, email, createdAt, balanceCents, isAdmin, isEnvironmentAdmin]
    AdminUsersResponse:
      type: object
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
      required: [users]
    AdminDashboardOverviewResponse:
      type: object
      properties:
        totalUsers: { type: integer, minimum: 0 }
        totalSalesCents: { type: integer, minimum: 0 }
        stockWorthCents: { type: integer, minimum: 0 }
      required: [totalUsers, totalSalesCents, stockWorthCents]
    MemberPageVisibilityPages:
      type: object
      properties:
        deposits: { type: boolean }
        depositHistory: { type: boolean }
        referrals: { type: boolean }
        redeemCode: { type: boolean }
        leaderboard: { type: boolean }
        buyLogs: { type: boolean }
        buyCards: { type: boolean }
        myLogOrders: { type: boolean }
        myCardOrders: { type: boolean }
        support: { type: boolean }
        accountManagement: { type: boolean }
      required:
        - deposits
        - depositHistory
        - referrals
        - redeemCode
        - leaderboard
        - buyLogs
        - buyCards
        - myLogOrders
        - myCardOrders
        - support
        - accountManagement
    MemberPageVisibilityResponse:
      type: object
      properties:
        pages: { $ref: "#/components/schemas/MemberPageVisibilityPages" }
        updatedAt: { type: string, format: date-time }
      required: [pages, updatedAt]
    MemberPageVisibilityUpdate:
      type: object
      properties:
        pages: { $ref: "#/components/schemas/MemberPageVisibilityPages" }
      required: [pages]
    AdminUserAccessInput:
      type: object
      properties:
        isAdmin: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 250 }
      required: [isAdmin, reason]
    AdminUserAccessResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        isAdmin: { type: boolean }
        changed: { type: boolean }
      required: [userId, isAdmin, changed]
    AdminBalanceAdjustmentInput:
      type: object
      properties:
        action: { type: string, enum: [credit, debit] }
        amountCents: { type: integer, minimum: 1, maximum: 2147483647 }
        reason: { type: string, minLength: 1, maxLength: 250 }
        requestId: { type: string, format: uuid }
      required: [action, amountCents, reason, requestId]
    AdminBalanceAdjustment:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        action: { type: string, enum: [credit, debit] }
        amountCents: { type: integer }
        signedAmountCents: { type: integer }
        reason: { type: string }
        adminName: { type: string }
        createdAt: { type: string, format: date-time }
        balanceCents: { type: integer }
        replayed: { type: boolean }
      required: [id, userId, action, amountCents, signedAmountCents, reason, adminName, createdAt, balanceCents, replayed]
    AdminBalanceAdjustmentResponse:
      type: object
      properties:
        adjustment: { $ref: "#/components/schemas/AdminBalanceAdjustment" }
      required: [adjustment]
    AuthMeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [authenticated, user]
    AuthResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [message, user]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        archivedAt: { type: ["string", "null"], format: date-time }
        showAsPopup: { type: boolean }
        telegramUrl: { type: ["string", "null"], format: uri, maxLength: 2048 }
        telegramButtonText: { type: string, maxLength: 60 }
      required: [id, title, body, createdAt, publishedAt, archivedAt, showAsPopup, telegramUrl, telegramButtonText]
    SupportTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [account, deposit_balance, purchase, other, card_purchase, log_purchase, deposits] }
        subject: { type: string }
        orderReference: { type: ["string", "null"] }
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, category, subject, orderReference, status, createdAt, updatedAt]
    SupportOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [card_purchase, log_purchase] }
        productName: { type: string }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        totalCents: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      required: [id, category, productName, description, quantity, totalCents, createdAt]
    MySupportOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/SupportOrder" }
      required: [orders]
    SupportTicketMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        authorUserId: { type: ["string", "null"], format: uuid }
        authorName: { type: string }
        authorRole: { type: string, enum: [member, admin] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, authorUserId, authorName, authorRole, body, createdAt]
    SupportTicketRefund:
      type: object
      properties:
        id: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 1 }
        reason: { type: string }
        adminName: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, amountCents, reason, adminName, createdAt]
    SupportTicketDetailResponse:
      type: object
      properties:
        ticket: { $ref: "#/components/schemas/SupportTicket" }
        matchedOrder:
          anyOf:
            - $ref: "#/components/schemas/SupportOrder"
            - type: "null"
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportTicketMessage" }
        refund:
          anyOf:
            - $ref: "#/components/schemas/SupportTicketRefund"
            - type: "null"
        memberName: { type: string }
        memberEmail: { type: string, format: email }
      required: [ticket, matchedOrder, messages, refund, memberName, memberEmail]
    SupportTicketListResponse:
      type: object
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/SupportTicket" }
      required: [tickets]
    AdminSupportTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [account, deposit_balance, purchase, other, card_purchase, log_purchase, deposits] }
        subject: { type: string }
        orderReference: { type: ["string", "null"] }
        status: { type: string, enum: [open, in_progress, resolved, closed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        memberName: { type: string }
        memberEmail: { type: string, format: email }
        hasRefund: { type: boolean }
        orderMatchStatus: { type: string, enum: [verified, unmatched, none] }
      required: [id, category, subject, orderReference, status, createdAt, updatedAt, memberName, memberEmail, hasRefund, orderMatchStatus]
    AdminSupportTicketListResponse:
      type: object
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/AdminSupportTicket" }
      required: [tickets]
    SupportTicketInput:
      type: object
      properties:
        category: { type: string, enum: [card_purchase, log_purchase, deposits] }
        subject: { type: string, minLength: 1, maxLength: 140 }
        orderReference: { type: string, maxLength: 120 }
        message: { type: string, minLength: 1, maxLength: 4000 }
      required: [category, subject, message]
    SupportTicketMessageInput:
      type: object
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
      required: [message]
    SupportTicketMessageResponse:
      type: object
      properties:
        message: { $ref: "#/components/schemas/SupportTicketMessage" }
      required: [message]
    SupportTicketStatusInput:
      type: object
      properties:
        status: { type: string, enum: [open, in_progress, resolved, closed] }
      required: [status]
    SupportTicketRefundInput:
      type: object
      properties:
        amountCents: { type: integer, minimum: 1, maximum: 2147483647 }
        reason: { type: string, minLength: 1, maxLength: 250 }
      required: [amountCents, reason]
    SupportTicketRefundResponse:
      type: object
      properties:
        refund: { $ref: "#/components/schemas/SupportTicketRefund" }
        balanceCents: { type: integer }
      required: [refund, balanceCents]
    AnnouncementListResponse:
      type: object
      properties:
        announcements:
          type: array
          items: { $ref: "#/components/schemas/Announcement" }
      required: [announcements]
    WeeklyLeaderboardEntry:
      type: object
