openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration, sessions, and password recovery
  - name: accountManagement
    description: Authenticated member account and security settings
  - name: telegramBot
    description: Telegram reward claims and bot updates
  - name: announcements
    description: Published member announcements
  - name: adminAnnouncements
    description: Admin-only announcement publishing and archiving
  - name: adminUsers
    description: Admin-only member search, access control, and balance adjustments
  - name: leaderboard
    description: Weekly rankings from confirmed member deposits
  - name: deposits
    description: Member deposits, balances, and referral rewards
  - name: depositAdmin
    description: Admin-only manual deposit approvals and payment settings
  - name: support
    description: Member support tickets and conversations
  - name: supportAdmin
    description: Admin ticket review and balance refunds
  - name: redeemCodes
    description: One-time balance redemption codes
  - name: licenseStore
    description: Member catalog, secure license delivery, and admin inventory management
  - name: giftCardStore
    description: Member prepaid gift-card catalog, secure order delivery, and admin inventory
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid registration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current session user
      responses:
        "200":
          description: Current authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
  /auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic response that does not disclose whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/reset-password:
    post:
      operationId: postAuthResetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Reset link is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/password:
    patch:
      operationId: changeAuthPassword
      tags: [accountManagement]
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Current password is incorrect or new password is invalid
        "401":
          description: Sign-in required
  /telegram-reward-code:
    post:
      operationId: createTelegramRewardCode
      tags: [accountManagement]
      summary: Create a short-lived Telegram reward code for the signed-in member
      description: Each ReplenishCC account and Telegram account may claim the $1 reward once per rolling 24 hours. The generated code expires after 10 minutes and is sent to the bot in a private Telegram chat.
      responses:
        "200":
          description: Short-lived code to claim the Telegram name reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramRewardCodeResponse"
        "401":
          description: Sign-in required
        "503":
          description: Telegram bot is not configured
  /telegram/webhook:
    post:
      operationId: postTelegramWebhook
      tags: [telegramBot]
      summary: Receive an authenticated Telegram Bot API update
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWebhookUpdate"
      responses:
        "200":
          description: Update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookAcknowledgement"
        "400":
          description: Invalid Telegram update
        "401":
          description: Webhook secret is invalid
  /account-deletion-requests/me:
    get:
      operationId: getMyAccountDeletionRequest
      tags: [accountManagement]
      summary: Get the signed-in user's latest deletion request
      responses:
        "200":
          description: Latest request or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountDeletionRequestResponse"
        "401":
          description: Sign-in required
    delete:
      operationId: cancelMyAccountDeletionRequest
      tags: [accountManagement]
      summary: Cancel the signed-in user's pending deletion request
      responses:
        "200":
          description: Pending request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Sign-in required
        "404":
          description: No pending request exists
  /account-deletion-requests:
    post:
      operationId: createAccountDeletionRequest
      tags: [accountManagement]
      summary: Request permanent account deletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequestInput"
      responses:
        "201":
          description: Deletion request submitted for admin review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountDeletionRequestResponse"
        "400":
          description: Invalid request details
        "401":
          description: Sign-in required
        "409":
          description: A pending request already exists
  /admin/account-deletion-requests:
    get:
      operationId: getAdminAccountDeletionRequests
      tags: [depositAdmin]
      summary: List pending account deletion requests
      responses:
        "200":
          description: Pending requests for authorized admin review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDeletionRequestsResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/account-deletion-requests/{requestId}:
    patch:
      operationId: reviewAccountDeletionRequest
      tags: [depositAdmin]
      summary: Approve permanent deletion or reject a request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAccountDeletionRequestInput"
      responses:
        "200":
          description: Request reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionReviewResult"
        "400":
          description: Request is no longer pending
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Request not found
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [adminUsers]
      summary: Search member accounts by email
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 254
      responses:
        "200":
          description: Matching members and their current account balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "400":
          description: Search text is too short or invalid
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/users/{userId}/access:
    patch:
      operationId: updateAdminUserAccess
      tags: [adminUsers]
      summary: Grant or revoke stored administrator access
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserAccessInput"
      responses:
        "200":
          description: Administrator access updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserAccessResponse"
        "400":
          description: Invalid account or access change
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Member not found
        "409":
          description: Access is environment-managed or this would remove the last administrator
  /admin/users/{userId}/balance-adjustments:
    post:
      operationId: createAdminBalanceAdjustment
      tags: [adminUsers]
      summary: Credit or debit a member balance with an audit reason
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBalanceAdjustmentInput"
      responses:
        "200":
          description: Balance adjustment recorded, or an idempotent retry returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBalanceAdjustmentResponse"
        "400":
          description: Invalid adjustment
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Member not found
        "409":
          description: Insufficient balance or adjustment request conflicts with a prior request
  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: List published announcements for the signed-in member
      responses:
        "200":
          description: Published announcements, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementListResponse"
        "401":
          description: Sign-in required
  /leaderboard/weekly:
    get:
      operationId: getWeeklyLeaderboard
      tags: [leaderboard]
      summary: Get the top ten confirmed deposit totals for the current UTC week
      responses:
        "200":
          description: Weekly ranking data with masked member email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyLeaderboardResponse"
        "401":
          description: Sign-in required
  /admin/announcements:
    get:
      operationId: getAdminAnnouncements
      tags: [adminAnnouncements]
      summary: List published and archived announcements
      responses:
        "200":
          description: Announcements available to an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementListResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
    post:
      operationId: createAnnouncement
      tags: [adminAnnouncements]
      summary: Publish a member announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Announcement published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "400":
          description: Invalid announcement details
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/announcements/{announcementId}:
    patch:
      operationId: updateAnnouncement
      tags: [adminAnnouncements]
      summary: Archive or restore an announcement
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementStatusInput"
      responses:
        "200":
          description: Announcement status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "400":
          description: Invalid announcement status
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Announcement not found
  /support/orders/me:
    get:
      operationId: getMySupportOrders
      tags: [support]
      summary: List safe order summaries for support-ticket references
      responses:
        "200":
          description: Gift-card and log orders belonging to the signed-in member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySupportOrdersResponse"
        "401":
          description: Sign-in required
  /support/tickets:
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Ticket and initial message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetailResponse"
        "400":
          description: Invalid ticket details
        "401":
          description: Sign-in required
  /support/tickets/me:
    get:
      operationId: getMySupportTickets
      tags: [support]
      summary: List the current user's tickets
      responses:
        "200":
          description: Tickets belonging to the signed-in member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketListResponse"
        "401":
          description: Sign-in required
  /support/tickets/{ticketId}:
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: Get a ticket conversation
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ticket conversation and any recorded balance refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetailResponse"
        "401":
          description: Sign-in required
        "403":
          description: Ticket belongs to another member
        "404":
          description: Ticket not found
  /support/tickets/{ticketId}/messages:
    post:
      operationId: postSupportTicketMessage
      tags: [support]
      summary: Add a message to a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketMessageInput"
      responses:
        "201":
          description: Message added to the ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketMessageResponse"
        "400":
          description: Invalid message
        "401":
          description: Sign-in required
        "403":
          description: Ticket belongs to another member
        "404":
          description: Ticket not found
        "409":
          description: Ticket is closed
  /admin/support/tickets:
    get:
      operationId: getAdminSupportTickets
      tags: [supportAdmin]
      summary: List support tickets for admin review
      responses:
        "200":
          description: Ticket queue with member identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportTicketListResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/support/tickets/{ticketId}/status:
    patch:
      operationId: patchAdminSupportTicketStatus
      tags: [supportAdmin]
      summary: Update a ticket status
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketStatusInput"
      responses:
        "200":
          description: Ticket status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetailResponse"
        "400":
          description: Invalid status
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Ticket not found
  /admin/support/tickets/{ticketId}/refund:
    post:
      operationId: createSupportTicketRefund
      tags: [supportAdmin]
      summary: Credit a member's balance for a support ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketRefundInput"
      responses:
        "201":
          description: Balance credit recorded in the account ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketRefundResponse"
        "400":
          description: Invalid refund details
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Ticket not found
        "409":
          description: This ticket already has a refund
  /deposits/methods:
    get:
      operationId: getDepositMethods
      tags: [deposits]
      summary: Get deposit methods and limits
      responses:
        "200":
          description: Current payment methods and configured recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositMethodsResponse"
        "401":
          description: Sign-in required
  /deposits/me:
    get:
      operationId: getMyDeposits
      tags: [deposits]
      summary: Get the current user's balance and deposit history
      responses:
        "200":
          description: Real balance and deposits for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDepositsResponse"
        "401":
          description: Sign-in required
  /deposits/manual:
    post:
      operationId: createManualDeposit
      tags: [deposits]
      summary: Create a manual Cash App, Chime, Apple Pay, or Venmo deposit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualDepositInput"
      responses:
        "201":
          description: Pending request with a unique payment note in the format Food - followed by a random number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"
        "400":
          description: Invalid amount or payment method is not configured
        "401":
          description: Sign-in required
        "409":
          description: This payment method is hidden by an administrator
  /deposits/crypto/currencies:
    get:
      operationId: getCryptoCurrencies
      tags: [deposits]
      summary: Get currencies available for this NOWPayments account
      responses:
        "200":
          description: Live currencies returned by NOWPayments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoCurrenciesResponse"
        "401":
          description: Sign-in required
        "409":
          description: Cryptocurrency deposits are hidden by an administrator
        "503":
          description: NOWPayments is not configured or unavailable
  /deposits/crypto:
    post:
      operationId: createCryptoDeposit
      tags: [deposits]
      summary: Create a NOWPayments cryptocurrency payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoDepositInput"
      responses:
        "201":
          description: Deposit address and payment instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoDepositResponse"
        "400":
          description: Invalid amount or unsupported currency
        "401":
          description: Sign-in required
        "409":
          description: Cryptocurrency deposits are hidden by an administrator
        "503":
          description: NOWPayments is not configured or unavailable
  /deposits/nowpayments/webhook:
    post:
      operationId: postNowPaymentsWebhook
      tags: [deposits]
      summary: Receive a signed NOWPayments payment notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NowPaymentsWebhookInput"
      responses:
        "200":
          description: Notification accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Invalid webhook signature
        "503":
          description: Webhook signature verification is not configured
  /referrals/me:
    get:
      operationId: getMyReferralSummary
      tags: [deposits]
      summary: Get the signed-in user's referral code, link, and real earnings
      responses:
        "200":
          description: Referral totals calculated from registered users and ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"
        "401":
          description: Sign-in required
  /admin/deposits:
    get:
      operationId: getAdminDeposits
      tags: [depositAdmin]
      summary: List deposits for admin review
      responses:
        "200":
          description: Real deposit requests and member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDepositsResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/deposits/{depositId}:
    patch:
      operationId: reviewDeposit
      tags: [depositAdmin]
      summary: Approve or reject a pending manual deposit
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositReviewInput"
      responses:
        "200":
          description: Reviewed deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"
        "400":
          description: Deposit is not awaiting review
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "404":
          description: Deposit not found
  /admin/deposit-methods:
    get:
      operationId: getAdminDepositMethods
      tags: [depositAdmin]
      summary: Get admin payment-recipient and minimum-deposit settings
      responses:
        "200":
          description: Current payment handles and minimum deposit threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositMethodsResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
    put:
      operationId: updateAdminDepositMethods
      tags: [depositAdmin]
      summary: Update payment handles and the minimum deposit threshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositMethodsInput"
      responses:
        "200":
          description: Saved payment handles and minimum deposit threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositMethodsResponse"
        "400":
          description: Invalid payment-recipient details
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
  /admin/redeem-codes:
    get:
      operationId: getAdminRedeemCodes
      tags: [depositAdmin]
      summary: List redemption codes for administrators
      responses:
        "200":
          description: Created codes and their redemption status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRedeemCodesResponse"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
    post:
      operationId: createAdminRedeemCode
      tags: [depositAdmin]
      summary: Create a one-time balance code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRedeemCodeInput"
      responses:
        "201":
          description: Code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRedeemCode"
        "400":
          description: Invalid code or amount
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "409":
          description: Code already exists
        "503":
          description: A unique code could not be generated
  /admin/redeem-codes/bulk:
    post:
      operationId: createAdminRedeemCodeBatch
      tags: [depositAdmin]
      summary: Create a batch of one-time balance codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCodeBatchInput"
      responses:
        "201":
          description: Batch of codes created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRedeemCodesResponse"
        "400":
          description: Invalid batch size or amount
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
        "503":
          description: A unique code could not be generated
  /redeem-codes/redeem:
    post:
      operationId: redeemCode
      tags: [redeemCodes]
      summary: Redeem a code and credit the signed-in member's balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCodeInput"
      responses:
        "200":
          description: Code redeemed and balance credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemCodeResult"
        "400":
          description: Code is invalid or has already been redeemed
        "401":
          description: Sign-in required
        "429":
          description: Too many redemption attempts
  /license-products:
    get:
      operationId: getLicenseProducts
      tags: [licenseStore]
